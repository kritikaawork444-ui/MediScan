# Render.com blueprint (optional)
# Dashboard → New → Blueprint → connect this repo
services:
  - type: web
    name: mediscan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./mediscan.db
      - key: FRONTEND_ORIGIN
        sync: false
